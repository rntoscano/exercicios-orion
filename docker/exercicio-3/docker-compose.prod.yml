name: exercicio-3-prod

services:
  api:
    build:
      context: .
      target: prod
    image: exercicio-3-api:prod
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-orion}
      DB_PASS: ${DB_PASS:-orion123}
      DB_NAME: ${DB_NAME:-orion_prod}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-orion}
      POSTGRES_PASSWORD: ${DB_PASS:-orion123}
      POSTGRES_DB: ${DB_NAME:-orion_prod}
    volumes:
      - dados-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dados-prod:
